<ion-menu contentId="main-content" type="overlay">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-label class="menu-brand">KCDF Parents</ion-label>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list lines="none">
      <ion-menu-toggle auto-hide="true">
        <ion-item button routerLink="/home" routerDirection="root">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item button routerLink="/groups" routerDirection="root">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Groups</ion-label>
        </ion-item>
        <ion-item button routerLink="/courses" routerDirection="root">
          <ion-icon name="school-outline" slot="start"></ion-icon>
          <ion-label>Courses</ion-label>
        </ion-item>
        <ion-item button routerLink="/posts" routerDirection="root">
          <ion-icon name="chatbubble-ellipses-outline" slot="start"></ion-icon>
          <ion-label>Posts</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-tabs class="app-tabs" id="main-content">
  <ion-header slot="top" class="app-header">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button aria-label="Open navigation menu"></ion-menu-button>
      </ion-buttons>
      <ion-label class="brand">KCDF <span>Parents</span></ion-label>
      <ion-buttons slot="end">
        <ion-button id="profile-menu-trigger" aria-label="Open profile menu">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-tab-bar slot="bottom" class="bottom-tabs">
    <ion-tab-button tab="home" routerLink="/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="groups" routerLink="/groups">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Groups</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="courses" routerLink="/courses">
      <ion-icon name="school-outline"></ion-icon>
      <ion-label>Courses</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="me" routerLink="/me">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Me</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<ion-popover trigger="profile-menu-trigger" triggerAction="click" side="bottom" alignment="end">
  <ng-template>
    <ion-content>
      <ion-list lines="none">
        <ion-item button routerLink="/me">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>
            <strong>My profile</strong>
            <p>{{ profile()?.display_name || 'View your account' }}</p>
          </ion-label>
        </ion-item>
        <ion-item button (click)="logout()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Sign out</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
