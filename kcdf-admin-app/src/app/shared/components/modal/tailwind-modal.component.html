
    <dialog
      #dialog
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] overflow-hidden rounded-2xl border border-gray-200 bg-white p-0 text-gray-900 shadow-2xl shadow-gray-950/20 backdrop:bg-gray-950/60 dark:border-gray-800 dark:bg-gray-900 dark:text-white"
      [style.max-width]="maxWidth"
      (cancel)="handleCancel($event)"
      (click)="handleDialogClick($event)">
      <h2 *ngIf="visuallyHiddenTitle" [id]="titleId" class="sr-only">{{ title }}</h2>
      <div *ngIf="!visuallyHiddenTitle" class="flex items-start gap-4 border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
        <h2 [id]="titleId" class="min-w-0 flex-1 text-lg font-semibold tracking-tight">{{ title }}</h2>
        <button
          type="button"
          aria-label="Close dialog"
          class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
          (click)="close()">
          <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-5 w-5">
            <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <button
        *ngIf="visuallyHiddenTitle"
        type="button"
        aria-label="Close dialog"
        class="absolute right-3 top-3 z-10 inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
        (click)="close()">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-5 w-5">
          <path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>

      <div
        class="dialog-content max-h-[calc(100dvh-2rem)] overflow-y-auto"
        [class.px-5]="!visuallyHiddenTitle"
        [class.py-5]="!visuallyHiddenTitle"
        [class.pt-2]="visuallyHiddenTitle">
        <ng-content></ng-content>
      </div>

      <footer
        *ngIf="hasActions"
        class="flex flex-wrap items-center justify-end gap-2 border-t border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
        <ng-content select="[modal-actions]"></ng-content>
      </footer>
    </dialog>
