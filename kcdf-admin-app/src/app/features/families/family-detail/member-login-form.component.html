<h2 class="border-b border-gray-200 px-6 py-5 text-lg font-semibold text-gray-900 dark:border-gray-800 dark:text-white">
  {{ isEditing ? 'Edit Member Login' : 'Create Member Login' }}
</h2>
<div class="px-6 py-5">
  <form [formGroup]="form" class="grid grid-cols-1 gap-4">
    <div>
      <label for="member-login-username" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">Username</label>
      <input id="member-login-username" type="text" formControlName="username" required autocomplete="username"
        class="block min-h-10 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-950 dark:text-white" />
      <p *ngIf="form.controls.username.touched && form.controls.username.invalid" class="mt-1 text-sm text-rose-600">Username is required.</p>
    </div>
    <div>
      <label for="member-login-display-name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">Display Name</label>
      <input id="member-login-display-name" type="text" formControlName="display_name" required
        class="block min-h-10 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-950 dark:text-white" />
    </div>
    <div>
      <label for="member-login-password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-200">Password {{ isEditing ? '(leave blank to keep current)' : '' }}</label>
      <input id="member-login-password" type="password" formControlName="password" [required]="!isEditing" autocomplete="new-password"
        class="block min-h-10 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500 dark:border-gray-700 dark:bg-gray-950 dark:text-white" />
    </div>
    <label *ngIf="isEditing" class="inline-flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
      <input type="checkbox" formControlName="is_active" class="h-4 w-4 rounded border-gray-300 text-indigo-600" />
      Login active
    </label>
  </form>
</div>
<div class="flex justify-end gap-2 border-t border-gray-200 px-6 py-4 dark:border-gray-800">
  <button type="button" (click)="dialogRef.close()"
    class="inline-flex min-h-10 items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200">Cancel</button>
  <button type="button" (click)="save()" [disabled]="saving"
    class="inline-flex min-h-10 items-center justify-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white disabled:opacity-60">{{ saving ? 'Saving...' : 'Save Login' }}</button>
</div>
