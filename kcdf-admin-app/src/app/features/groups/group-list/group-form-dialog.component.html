<div class="px-6 pt-6 text-xl font-semibold tracking-tight text-gray-900 dark:text-white">
  {{ group ? 'Edit Group' : 'Create Group' }}
</div>
<div class="px-6 py-4">
  <form [formGroup]="form" class="flex min-w-0 flex-col gap-4 sm:min-w-[26rem]">
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">
      Group Name
      <input
        formControlName="group_name"
        required
        maxlength="255"
        class="mt-1 block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white"
      />
      <span *ngIf="form.controls.group_name.touched && form.controls.group_name.invalid" class="mt-1 block text-sm text-red-600">Enter a name up to 255 characters.</span>
    </label>

    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">
      Group Display Name
      <input formControlName="display_name" maxlength="255" class="mt-1 block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white" />
    </label>

    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">
      Description
      <textarea formControlName="description" rows="3" maxlength="20000" class="mt-1 block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white"></textarea>
    </label>

    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">
      Category
      <select formControlName="category_id" class="mt-1 block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white">
        <option [ngValue]="null">No category</option>
        <option *ngFor="let category of categories()" [ngValue]="category.id">{{ category.category_name }}</option>
      </select>
    </label>

    <p *ngIf="lookupError()" class="text-sm text-red-600" role="alert">{{ lookupError() }}</p>
  </form>
</div>
<div class="flex justify-end gap-2 px-6 pb-5">
  <button type="button" (click)="dialogRef.close()" class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-800">Cancel</button>
  <button type="button" (click)="save()" [disabled]="saving" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">
    {{ saving ? 'Saving...' : 'Save' }}
  </button>
</div>
